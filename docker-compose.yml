services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soltrader
      POSTGRES_USER: soltrader
      POSTGRES_PASSWORD: soltrader_password
    ports:
      - "5432:5432"
    volumes:
      - soltrader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soltrader -d soltrader"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - soltrader_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  soltrader_pg:
  soltrader_redis:
