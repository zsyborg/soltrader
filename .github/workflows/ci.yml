name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trader dependencies
        run: npm install
      - name: Type-check trader
        run: npm run typecheck
      - name: Test trader
        run: npm test
      - name: Build trader
        run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build
